name: nousviz
version: 0.2.0
description: "Give Hermes a data platform: push data into NousViz, query it with SQL, build dashboards and alerts by conversation, and stream the agent's own activity into a Mission Control dashboard. Works against any stock NousViz >= 1.0.6 install."
author: "NousViz (statsdrone)"
provides_tools:
  - nousviz_query
  - nousviz_push
  - nousviz_create_dashboard
  - nousviz_create_alert
  - nousviz_dashboard_link
  - nousviz_share_dashboard
provides_hooks:
  - post_tool_call
  - on_session_end
python_dependencies:
  - requests
